[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-shot-model-evaluation"
version = "0.1.0"
description = "Paired model-evaluation methods with a reproducible synthetic example"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["zero_shot_evaluation*"]
